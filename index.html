    /* =========================================
       FETCH LIVE REGISTRATIONS FROM APPS SCRIPT
    ========================================= */
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzl7p3-sbaHe6P5VQ7t2FDGJzuDGSGRADL2q0sxoKtbhWe6yogYWqqoZ8j26JxZfqJTvw/exec";

    async function fetchLiveRegistrations() {
      const statElement = document.getElementById("liveRegistrations");
      if (!statElement) return;

      try {
        const response = await fetch(APPS_SCRIPT_URL, {
          method: "GET",
          redirect: "follow"
        });

        const data = await response.json();

        if (data && typeof data.totalRegistrations !== "undefined") {
statElement.textContent = data.totalRegistrations + "/100";
        }
      } catch (error) {
        console.error("Could not fetch live count, showing fallback value:", error);
      }
    }

    // 1. Fetch count immediately on page load
    document.addEventListener("DOMContentLoaded", fetchLiveRegistrations);

    // 2. Refresh count automatically every 5 seconds
    setInterval(fetchLiveRegistrations, 5000);


    /* =========================================
       FAST SUBMIT FORM TO GOOGLE SHEETS
    ========================================= */
    const regForm = document.getElementById("regForm");
    const successMsg = document.getElementById("successMsg");

    regForm.addEventListener("submit", (event) => {
      event.preventDefault();

      const submitButton = regForm.querySelector('button[type="submit"]');

      // Instant UI feedback
      submitButton.disabled = true;
      submitButton.textContent = "Registration Complete ✓";
      
      successMsg.textContent = "Registration submitted successfully! Your seat is reserved.";
      successMsg.classList.remove("error-msg");
      successMsg.classList.add("show");

      const formData = new FormData(regForm);
      regForm.reset();

      // Send to Google Sheets in background
      fetch(regForm.action, {
        method: "POST",
        body: formData,
        mode: "no-cors"
      })
      .then(() => {
        // Refresh count 5 seconds after form submission
        setTimeout(fetchLiveRegistrations, 5000);
      })
      .catch((error) => {
        console.error("Background save error:", error);
      });
    });

  </script>
